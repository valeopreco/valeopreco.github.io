# Publica o VALE? no GitHub Pages a cada push na branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todo dia 12, depois da divulgação mensal do IPCA: atualiza os dados e republica.
  schedule:
    - cron: '17 12 12 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Atualizar dados do IPCA (IBGE)
        run: node scripts/ipca.mjs
      - name: Build
        run: npm run build
        # Configuração pública de produção fica em .env.production (URL do site e do Supabase, chave anon).
      # GitHub Pages não reescreve rotas: o 404.html carrega o app em qualquer endereço.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
